{% extends "base.html" %}

{% block title %}
Doctor Profile - SmartCare AI
{% endblock %}

{% block content %}

<div class="container">

    <h1>Doctor Profile</h1>

    <div class="form-container">

        <div class="form-group">
            <label>Username</label>
            <input
                type="text"
                value="{{ session.get('username') }}"
                readonly>
        </div>

        <div class="form-group">
            <label>Role</label>
            <input
                type="text"
                value="Doctor"
                readonly>
        </div>

    </div>

</div>

{% endblock %}
