{% extends "base.html" %}

{% block title %}
Patient Treatment - SmartCare AI
{% endblock %}

{% block content %}

<div class="container">

    <h1>Patient Treatment</h1>

    <div class="form-container">

        <h2>{{ patient.name }}</h2>

        <form method="POST">

            <div class="form-group">

                <label>Diagnosis</label>

                <textarea
                    name="diagnosis"
                    placeholder="Enter diagnosis"
                    required></textarea>

            </div>

            <div class="form-group">

                <label>Prescription</label>

                <textarea
                    name="prescription"
                    placeholder="Enter prescription"
                    required></textarea>

            </div>

            <div class="form-group">

                <label>Treatment</label>

                <textarea
                    name="treatment"
                    placeholder="Enter treatment details"
                    required></textarea>

            </div>

            <div class="form-group">

                <label>Follow-up Date</label>

                <input
                    type="date"
                    name="follow_up">

            </div>

            <button type="submit" class="btn">
                Save Treatment
            </button>

        </form>

    </div>

</div>

{% endblock %}
