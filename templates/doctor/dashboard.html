{% extends "base.html" %}

{% block title %}
Doctor Dashboard - SmartCare AI
{% endblock %}

{% block content %}

<div class="container">

    <h1>Doctor Dashboard</h1>

    <p>
        Welcome, Dr. {{ session.get('username') }}
    </p>

    <br>

    <div class="card-container">

        <div class="card">
            <h3>My Patients</h3>
            <div class="number">{{ patients|length }}</div>
        </div>

        <div class="card">
            <h3>Today's Appointments</h3>
            <div class="number">0</div>
        </div>

        <div class="card">
            <h3>Pending Treatments</h3>
            <div class="number">0</div>
        </div>

        <div class="card">
            <h3>Follow-ups</h3>
            <div class="number">0</div>
        </div>

    </div>

</div>

{% endblock %}
