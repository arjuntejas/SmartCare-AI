{% extends "base.html" %}

{% block title %}
Login - SmartCare AI
{% endblock %}

{% block extra_css %}

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/login.css') }}">

{% endblock %}


{% block content %}

<div class="login-page">

    <div class="login-box">

        <div class="login-logo">
            🏥
        </div>

        <h1>SmartCare AI</h1>

        <p>Hospital Management & AI Decision Support</p>


        <form method="POST"
              action="{{ url_for('login') }}">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required>

            </div>


            <div class="form-group">

                <label for="role">
                    Role
                </label>

                <select id="role" name="role" required>

                    <option value="">
                        Select Role
                    </option>

                    <option value="admin">
                        Administrator
                    </option>

                    <option value="doctor">
                        Doctor
                    </option>

                    <option value="receptionist">
                        Receptionist
                    </option>

                </select>

            </div>


            <button type="submit" class="btn">
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
